        /* Parallax Header */
      .hero {

}

        .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background:  } /* Overlay vermelho */

        .badge { background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(10px); }

        .content { padding: 80px 20px; background: #8B0000; text-align: center; }

        .link-btn { display: block; margin: 15px auto; padding: 15px 30px; background: #fff; color: #8B0000; text-decoration: none; border-radius: 50px; font-weight: bold; max-width: 300px; transition: transform 0.3s; }
        .link-btn:hover { transform: scale(1.05); }

        /* Responsivo */
        @media (max-width: 768px) { .hero h1 { font-size: 2.5rem; } .hero p { font-size: 1.2rem; } }
        
        /* Parallax JS */
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            document.querySelector('.hero').style.transform = `translateY(${scrolled * 0.5}px)`;
        });
    </style>
</head>
